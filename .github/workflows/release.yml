name: Build and publish Ploopy

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build and verify package
        shell: pwsh
        env:
          PLOOPY_VERSION: ${{ github.ref_name }}
        run: ./installer/Собрать пакет.ps1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release/Ploopy-${{ github.ref_name }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
